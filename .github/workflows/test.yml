name: Tests

on:
  push:
    branches: [ master, feature_gsf2025 ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[tests]

    - name: Run tests
      run: |
        pytest tests/ -v --junitxml=junit/test-results-${{ matrix.python-version }}.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: junit/test-results-*.xml

    - name: Upload plot artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: plots-python-${{ matrix.python-version }}
        path: tests/*.png
        if-no-files-found: warn

  # Separate job to collect all plots in one place
  collect-plots:
    name: Collect all plots
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - name: Download all plot artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: plots-python-*
        path: all-plots
        merge-multiple: true

    - name: Upload combined plots
      uses: actions/upload-artifact@v4
      with:
        name: all-plots-combined
        path: all-plots/
        if-no-files-found: warn

  # Build and check package
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package-dist
        path: dist/
